name: Main CI-CD Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  job1:
    uses: ./.github/workflows/run-selected-job.yml
    with:
      target_job: job1

  job2:
    needs: job1
    uses: ./.github/workflows/run-selected-job.yml
    with:
      target_job: job2

  job3:
    needs: job2
    uses: ./.github/workflows/run-selected-job.yml
    with:
      target_job: job3

  job4:
    needs: job3
    uses: ./.github/workflows/run-selected-job.yml
    with:
      target_job: job4

  job5:
    needs: job4
    uses: ./.github/workflows/run-selected-job.yml
    with:
      target_job: job5