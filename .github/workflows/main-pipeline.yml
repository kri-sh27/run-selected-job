name: Main CI-CD Pipeline

on:
  workflow_dispatch:
    inputs:
      start_job:
        description: Select the job from which to execute the pipeline
        required: true
        type: choice
        default: job1
        options:
          - job1
          - job2
          - job3
          - job4
          - job5

permissions:
  contents: read

jobs:
  job1:
    if: ${{ inputs.start_job == 'job1' }}
    uses: ./.github/workflows/run-selected-job.yml
    with:
      target_job: job1

  job2:
    if: ${{ inputs.start_job == 'job1' || inputs.start_job == 'job2' }}
    needs: job1
    uses: ./.github/workflows/run-selected-job.yml
    with:
      target_job: job2

  job3:
    if: ${{ !cancelled() && (inputs.start_job == 'job1' || inputs.start_job == 'job2' || inputs.start_job == 'job3') }}
    needs: job2
    uses: ./.github/workflows/run-selected-job.yml
    with:
      target_job: job3

  job4:
    if: ${{ !cancelled() && (inputs.start_job == 'job1' || inputs.start_job == 'job2' || inputs.start_job == 'job3' || inputs.start_job == 'job4') }}
    needs: job3
    uses: ./.github/workflows/run-selected-job.yml
    with:
      target_job: job4

  job5:
    if: ${{ !cancelled() && (inputs.start_job == 'job1' || inputs.start_job == 'job2' || inputs.start_job == 'job3' || inputs.start_job == 'job4' || inputs.start_job == 'job5') }}
    needs: job4
    uses: ./.github/workflows/run-selected-job.yml
    with:
      target_job: job5